name: Build cross-platform portable packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher.py"
      - "README.md"
      - "LICENSE"
      - "docs/**"
      - "scripts/**"
      - "linux/**"
      - "macos/**"
      - "config/**"
      - "portable/**"
      - "bootable/**"
      - ".github/workflows/portable-build.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            executable: RemoteDesktopToolkit.exe
          - os: ubuntu-latest
            platform: Linux-x64
            executable: RemoteDesktopToolkit
          - os: macos-latest
            platform: macOS
            executable: RemoteDesktopToolkit
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build portable launcher
        run: pyinstaller --noconfirm --clean --onedir --name RemoteDesktopToolkit launcher.py
      - name: Include toolkit resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "dist/RemoteDesktopToolkit"
          Copy-Item README.md $target/
          if (Test-Path LICENSE) { Copy-Item LICENSE $target/ }
          foreach ($folder in @("docs", "scripts", "linux", "macos", "config", "portable", "bootable")) {
            Copy-Item $folder "$target/$folder" -Recurse
          }
          @("@echo off", "setlocal", "cd /d %~dp0", "RemoteDesktopToolkit.exe") |
            Set-Content "$target/Run-Toolkit.bat" -Encoding ascii
      - name: Include toolkit resources (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target="dist/RemoteDesktopToolkit"
          cp README.md "$target/"
          if [ -f LICENSE ]; then cp LICENSE "$target/"; fi
          cp -R docs scripts linux macos config portable bootable "$target/"
          cat > "$target/Run-Toolkit.sh" <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")"
          exec ./RemoteDesktopToolkit
          EOF
          chmod +x "$target/Run-Toolkit.sh" "$target/RemoteDesktopToolkit"
      - name: Verify package contents
        shell: bash
        run: |
          test -f "dist/RemoteDesktopToolkit/${{ matrix.executable }}"
          test -f "dist/RemoteDesktopToolkit/docs/CONNECT_TWO_DEVICES.md"
          test -f "dist/RemoteDesktopToolkit/README.md"
      - name: Smoke-test packaged launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf '0\n' | "dist/RemoteDesktopToolkit/${{ matrix.executable }}"
      - name: Smoke-test packaged launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "0" | & "dist/RemoteDesktopToolkit/RemoteDesktopToolkit.exe"
          if ($LASTEXITCODE -ne 0) { throw "Portable launcher smoke test failed" }
      - name: Create ZIP archive
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('RemoteDesktopToolkit-${{ matrix.platform }}', 'zip', root_dir='dist', base_dir='RemoteDesktopToolkit')"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesktopToolkit-${{ matrix.platform }}
          path: RemoteDesktopToolkit-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30
